<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ПогосКафе — заказ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600;9..144,700&family=Space+Mono:wght@400;700&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #1a120c;
    --bg-panel: #241811;
    --bg-field: #2c1f16;
    --cream: #f2e6d5;
    --cream-dim: #cdbca5;
    --gold: #c99a4e;
    --gold-soft: #8a6a3a;
    --line: rgba(201,154,78,0.28);
    --error: #d97757;
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  body{
    background: var(--bg);
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .screen{
    display: none;
    min-height: 100vh;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
    animation: fadeIn 0.5s ease;
  }
  .screen.active{ display: flex; }

  @keyframes fadeIn{
    from{ opacity: 0; transform: translateY(8px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  /* ---------- ЛОГОТИП (на всех экранах) ---------- */
  .brand{
    position: fixed;
    top: 20px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    user-select: none;
    z-index: 50;
    -webkit-tap-highlight-color: transparent;
  }
  .brand svg{ width: 30px; height: 30px; flex-shrink: 0; }
  .brand span{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 15px;
    color: var(--gold);
    letter-spacing: 0.01em;
  }

  /* ---------- ЭКРАН 1: ПРИВЕТСТВИЕ ---------- */
  #screen-welcome{
    background:
      radial-gradient(ellipse 70% 50% at 50% 0%, rgba(201,154,78,0.10), transparent 60%),
      var(--bg);
    position: relative;
  }
  #screen-welcome::before{
    content:"";
    position: absolute; inset: 0;
    opacity: 0.35;
    background-image:
      radial-gradient(ellipse 16px 24px at 10% 20%, #3a2a1c 40%, transparent 41%),
      radial-gradient(ellipse 14px 20px at 80% 15%, #3a2a1c 40%, transparent 41%),
      radial-gradient(ellipse 18px 26px at 60% 70%, #3a2a1c 40%, transparent 41%),
      radial-gradient(ellipse 12px 18px at 25% 80%, #3a2a1c 40%, transparent 41%),
      radial-gradient(ellipse 15px 22px at 90% 60%, #3a2a1c 40%, transparent 41%),
      radial-gradient(ellipse 13px 19px at 40% 40%, #3a2a1c 40%, transparent 41%),
      radial-gradient(ellipse 17px 25px at 5% 55%, #3a2a1c 40%, transparent 41%),
      radial-gradient(ellipse 11px 17px at 70% 90%, #3a2a1c 40%, transparent 41%);
    pointer-events: none;
  }

  .welcome-inner{ position: relative; text-align: center; max-width: 480px; }

  .welcome-eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  h1.welcome-title{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(32px, 7vw, 48px);
    line-height: 1.15;
    margin-bottom: 40px;
  }

  .lang-buttons{
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .lang-btn{
    font-family: 'Work Sans', sans-serif;
    font-size: 16px;
    font-weight: 400;
    color: var(--cream);
    background: var(--bg-panel);
    border: 1px solid var(--line);
    padding: 16px 24px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.2s, background 0.2s;
  }
  .lang-btn:hover{ border-color: var(--gold); background: var(--bg-field); }
  .lang-btn:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ---------- ЗАГОЛОВКИ ЭКРАНОВ ---------- */
  .step-eyebrow{
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }
  h2.step-title{
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: clamp(28px, 6vw, 38px);
    margin-bottom: 36px;
    text-align: center;
  }

  /* ---------- ЭКРАН 2: НАПИТКИ ---------- */
  .drink-grid{
    display: grid;
    grid-template-columns: repeat(2, minmax(140px, 1fr));
    gap: 14px;
    width: 100%;
    max-width: 460px;
  }
  .drink-card{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 22px 14px;
    text-align: center;
    cursor: pointer;
    font-family: 'Fraunces', serif;
    font-size: 17px;
    color: var(--cream);
    transition: border-color 0.2s, transform 0.15s, background 0.2s;
  }
  .drink-card:hover{ border-color: var(--gold); background: var(--bg-field); transform: translateY(-2px); }
  .drink-card:focus-visible{ outline: 2px solid var(--gold); outline-offset: 3px; }

  /* ---------- ЭКРАН 3: ФОРМА ---------- */
  #screen-form{ align-items: stretch; padding-top: 100px; }
  .form-wrap{ width: 100%; max-width: 420px; margin: 0 auto; }

  .field{ margin-bottom: 22px; }
  .field label{
    display: block;
    font-family: 'Space Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--gold-soft);
    margin-bottom: 8px;
  }
  .field input[type="text"], .field input[type="email"]{
    width: 100%;
    background: var(--bg-field);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 13px 14px;
    color: var(--cream);
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
  }
  .field input:focus{ outline: none; border-color: var(--gold); }
  .field-error{
    color: var(--error);
    font-size: 12.5px;
    margin-top: 6px;
    display: none;
  }
  .field-error.show{ display: block; }
  .field input.error{ border-color: var(--error); }

  /* сахар — выбор ложек */
  .sugar-toggle{
    background: var(--bg-field);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 13px 14px;
    cursor: pointer;
    color: var(--cream);
    font-size: 15px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .sugar-options{
    display: none;
    gap: 8px;
    margin-top: 8px;
  }
  .sugar-options.open{ display: flex; }
  .sugar-opt{
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    cursor: pointer;
    font-family: 'Space Mono', monospace;
    font-size: 14px;
    color: var(--cream-dim);
  }
  .sugar-opt.selected{ border-color: var(--gold); color: var(--gold); background: var(--bg-panel); }

  /* вкус */
  .flavor-options{ display: flex; flex-direction: column; gap: 8px; }
  .flavor-opt{
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 12px 14px;
    cursor: pointer;
    font-size: 14.5px;
    color: var(--cream-dim);
    transition: border-color 0.2s, color 0.2s;
  }
  .flavor-opt.selected{ border-color: var(--gold); color: var(--gold); background: var(--bg-panel); }
  .flavor-opt.secret{
    border-color: rgba(201,154,78,0.5);
    background: linear-gradient(90deg, rgba(201,154,78,0.08), transparent);
  }

  .submit-btn{
    width: 100%;
    margin-top: 12px;
    background: var(--gold);
    color: var(--bg);
    border: none;
    border-radius: 4px;
    padding: 15px;
    font-family: 'Work Sans', sans-serif;
    font-weight: 600;
    font-size: 15px;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .submit-btn:hover{ opacity: 0.9; }
  .submit-btn:disabled{ opacity: 0.5; cursor: default; }

  /* ---------- МОДАЛКА ПОДТВЕРЖДЕНИЯ ---------- */
  .modal-overlay{
    position: fixed; inset: 0;
    background: rgba(10,7,4,0.7);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 24px;
  }
  .modal-overlay.open{ display: flex; }
  .modal{
    background: var(--bg-panel);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 28px;
    max-width: 380px;
    width: 100%;
  }
  .modal h3{
    font-family: 'Fraunces', serif;
    font-size: 22px;
    color: var(--gold);
    margin-bottom: 14px;
  }
  .modal p{
    font-size: 14.5px;
    color: var(--cream-dim);
    line-height: 1.7;
    margin-bottom: 22px;
    white-space: pre-line;
  }
  .modal-buttons{ display: flex; gap: 10px; }
  .modal-buttons button{
    flex: 1;
    padding: 12px;
    border-radius: 4px;
    font-size: 14px;
    cursor: pointer;
    font-family: 'Work Sans', sans-serif;
  }
  .btn-yes{ background: var(--gold); color: var(--bg); border: none; font-weight: 600; }
  .btn-no{ background: transparent; color: var(--cream-dim); border: 1px solid var(--line); }

  /* ---------- ЭКРАН 4: СПАСИБО ---------- */
  #screen-thanks{ text-align: center; }
  .cup-icon{ width: 56px; height: 56px; margin-bottom: 24px; }
  #screen-thanks h2{
    font-family: 'Fraunces', serif;
    font-size: clamp(26px, 6vw, 36px);
    margin-bottom: 14px;
  }
  #screen-thanks p{ color: var(--cream-dim); font-size: 15px; max-width: 340px; }

  /* ---------- ТОСТ (пасхалка) ---------- */
  .toast{
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--gold);
    color: var(--bg);
    padding: 14px 22px;
    border-radius: 6px;
    font-family: 'Space Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.03em;
    text-align: center;
    max-width: 320px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 200;
  }
  .toast.show{ opacity: 1; transform: translateX(-50%) translateY(0); }

  .send-error{
    color: var(--error);
    text-align: center;
    font-size: 13px;
    margin-top: 14px;
    display: none;
  }
  .send-error.show{ display: block; }

  @media (max-width: 380px){
    .drink-grid{ grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ЛОГОТИП: присутствует на всех экранах, двойной клик = пасхалка -->
<div class="brand" id="brand-logo" aria-label="ПогосКафе">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 8h13a3 3 0 0 1 0 6h-1" stroke="#c99a4e" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M4 8v7a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-1" stroke="#c99a4e" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M8 3.5c-.5 1 .5 1.5 0 2.5M12 3.5c-.5 1 .5 1.5 0 2.5" stroke="#c99a4e" stroke-width="1.2" stroke-linecap="round"/>
  </svg>
  <span>ПогосКафе</span>
</div>

<!-- ЭКРАН 1: ПРИВЕТСТВИЕ / ВЫБОР ЯЗЫКА -->
<section class="screen active" id="screen-welcome">
  <div class="welcome-inner">
    <div class="welcome-eyebrow">Своё зерно · своя обжарка</div>
    <h1 class="welcome-title">Добро пожаловать<br>в наше кафе</h1>
    <div class="lang-buttons">
      <button class="lang-btn" onclick="selectLang('ru')">Продолжить на русском</button>
      <button class="lang-btn" onclick="selectLang('en')">Continue in English</button>
      <button class="lang-btn" onclick="selectLang('fr')">Continuer en français</button>
    </div>
  </div>
</section>

<!-- ЭКРАН 2: ВЫБОР НАПИТКА -->
<section class="screen" id="screen-drink">
  <div class="step-eyebrow" id="drink-eyebrow"></div>
  <h2 class="step-title" id="drink-title"></h2>
  <div class="drink-grid" id="drink-grid"></div>
</section>

<!-- ЭКРАН 3: ФОРМА ЗАКАЗА -->
<section class="screen" id="screen-form">
  <div class="form-wrap">
    <h2 class="step-title" id="form-title"></h2>

    <div class="field">
      <label id="label-email"></label>
      <input type="email" id="input-email" autocomplete="email">
      <div class="field-error" id="error-email"></div>
    </div>

    <div class="field">
      <label id="label-name"></label>
      <input type="text" id="input-name" autocomplete="name">
      <div class="field-error" id="error-name"></div>
    </div>

    <div class="field">
      <label id="label-sugar"></label>
      <div class="sugar-toggle" id="sugar-toggle">
        <span id="sugar-toggle-text"></span>
        <span>▾</span>
      </div>
      <div class="sugar-options" id="sugar-options"></div>
    </div>

    <div class="field">
      <label id="label-flavor"></label>
      <div class="flavor-options" id="flavor-options"></div>
    </div>

    <button class="submit-btn" id="submit-btn"></button>
    <div class="send-error" id="send-error"></div>
  </div>
</section>

<!-- ЭКРАН 4: СПАСИБО -->
<section class="screen" id="screen-thanks">
  <svg class="cup-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M4 8h13a3 3 0 0 1 0 6h-1" stroke="#c99a4e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M4 8v7a4 4 0 0 0 4 4h4a4 4 0 0 0 4-4v-1" stroke="#c99a4e" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M8 3.5c-.5 1 .5 1.5 0 2.5M12 3.5c-.5 1 .5 1.5 0 2.5" stroke="#c99a4e" stroke-width="1" stroke-linecap="round"/>
  </svg>
  <h2 id="thanks-title"></h2>
  <p id="thanks-text"></p>
</section>

<!-- МОДАЛКА ПОДТВЕРЖДЕНИЯ -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3 id="modal-title"></h3>
    <p id="modal-text"></p>
    <div class="modal-buttons">
      <button class="btn-no" id="modal-no"></button>
      <button class="btn-yes" id="modal-yes"></button>
    </div>
  </div>
</div>

<!-- ТОСТ ПАСХАЛКИ -->
<div class="toast" id="toast"></div>

<script>
/* ============ НАСТРОЙКИ ============ */
// После деплоя бэкенда на Render впиши сюда его адрес, например:
// const BACKEND_URL = 'https://pogos-cafe-backend.onrender.com/order';
const BACKEND_URL = 'https://menudelapogocafe4-3.onrender.com/order';

/* ============ ПЕРЕВОДЫ ============ */
const T = {
  ru: {
    drinkEyebrow: 'Шаг 1 из 2',
    drinkTitle: 'Что будете заказывать?',
    drinks: ['Латте','Американо','Айс-латте','Капучино','Мокко','Холодный мокко'],
    formTitle: 'Ещё пара деталей',
    labelEmail: 'Ваша почта',
    placeholderEmail: 'мы напишем, когда кофе будет готов',
    errorEmail: 'Пожалуйста, укажите вашу почту',
    labelName: 'Как вас зовут',
    placeholderName: 'ваше имя',
    errorName: 'Пожалуйста, укажите ваше имя',
    labelSugar: 'Сколько сахара',
    sugarSpoon: (n) => n === 1 ? 'ложка' : (n < 5 ? 'ложки' : 'ложек'),
    sugarPlaceholder: 'выберите количество',
    labelFlavor: 'Вкус кофе',
    flavors: ['Без кофеина','С кофеином','Со вкусом лёгкого шоколада'],
    secretFlavor: 'Дубайский шоколад (Limited)',
    submitBtn: 'Оформить заказ',
    sending: 'Отправляем…',
    sendError: 'Не удалось отправить заказ. Проверьте соединение и попробуйте ещё раз.',
    modalTitle: 'Вы уверены?',
    modalText: (o) => `Напиток: ${o.drink}\nСахар: ${o.sugar} ${T.ru.sugarSpoon(o.sugar)}\nВкус: ${o.flavor}\nИмя: ${o.name}\nПочта: ${o.email}`,
    modalYes: 'Да, я уверен(а)',
    modalNo: 'Нет, хочу изменить',
    thanksTitle: 'Спасибо за заказ!',
    thanksText: 'Наш лучший бариста уже готовит ваш кофе. Мы напишем на почту, как только он будет готов ☕',
    secretToast: '🎉 СЕКРЕТНОЕ МЕНЮ! Поздравляю, вы нашли тайное меню'
  },
  en: {
    drinkEyebrow: 'Step 1 of 2',
    drinkTitle: 'What would you like?',
    drinks: ['Latte','Americano','Iced Latte','Cappuccino','Mocha','Iced Mocha'],
    formTitle: 'A couple more details',
    labelEmail: 'Your email',
    placeholderEmail: "we'll write when your coffee is ready",
    errorEmail: 'Please enter your email',
    labelName: 'Your name',
    placeholderName: 'your name',
    errorName: 'Please enter your name',
    labelSugar: 'How much sugar',
    sugarSpoon: (n) => n === 1 ? 'spoon' : 'spoons',
    sugarPlaceholder: 'choose amount',
    labelFlavor: 'Coffee flavor',
    flavors: ['Decaf','Regular (with caffeine)','Light chocolate flavor'],
    secretFlavor: 'Dubai Chocolate (Limited)',
    submitBtn: 'Place order',
    sending: 'Sending…',
    sendError: "Couldn't send your order. Check your connection and try again.",
    modalTitle: 'Are you sure?',
    modalText: (o) => `Drink: ${o.drink}\nSugar: ${o.sugar} ${T.en.sugarSpoon(o.sugar)}\nFlavor: ${o.flavor}\nName: ${o.name}\nEmail: ${o.email}`,
    modalYes: "Yes, I'm sure",
    modalNo: 'No, let me change it',
    thanksTitle: 'Thanks for your order!',
    thanksText: "Our best barista is preparing your coffee. We'll email you the moment it's ready ☕",
    secretToast: '🎉 SECRET MENU! Congrats, you found the hidden menu'
  },
  fr: {
    drinkEyebrow: 'Étape 1 sur 2',
    drinkTitle: 'Que souhaitez-vous commander ?',
    drinks: ['Latte','Americano','Latte glacé','Cappuccino','Moka','Moka glacé'],
    formTitle: 'Encore quelques détails',
    labelEmail: 'Votre email',
    placeholderEmail: 'nous vous écrirons quand votre café sera prêt',
    errorEmail: 'Veuillez indiquer votre email',
    labelName: 'Votre prénom',
    placeholderName: 'votre prénom',
    errorName: 'Veuillez indiquer votre prénom',
    labelSugar: 'Combien de sucre',
    sugarSpoon: (n) => n === 1 ? 'cuillère' : 'cuillères',
    sugarPlaceholder: 'choisissez la quantité',
    labelFlavor: 'Saveur du café',
    flavors: ['Décaféiné','Normal (avec caféine)','Léger goût chocolat'],
    secretFlavor: 'Chocolat de Dubaï (Édition limitée)',
    submitBtn: 'Passer la commande',
    sending: 'Envoi…',
    sendError: "Impossible d'envoyer la commande. Vérifiez votre connexion et réessayez.",
    modalTitle: 'Êtes-vous sûr(e) ?',
    modalText: (o) => `Boisson : ${o.drink}\nSucre : ${o.sugar} ${T.fr.sugarSpoon(o.sugar)}\nSaveur : ${o.flavor}\nPrénom : ${o.name}\nEmail : ${o.email}`,
    modalYes: 'Oui, je suis sûr(e)',
    modalNo: 'Non, je veux modifier',
    thanksTitle: 'Merci pour votre commande !',
    thanksText: 'Notre meilleur barista prépare votre café. Nous vous écrirons dès qu\'il sera prêt ☕',
    secretToast: '🎉 MENU SECRET ! Félicitations, vous avez trouvé le menu caché'
  }
};

/* ============ СОСТОЯНИЕ ЗАКАЗА ============ */
const order = { lang: 'ru', drink: null, sugar: null, flavor: null, name: '', email: '' };
let secretUnlocked = false;

/* ============ НАВИГАЦИЯ МЕЖДУ ЭКРАНАМИ ============ */
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function selectLang(lang){
  order.lang = lang;
  renderDrinkScreen();
  renderFormScreen();
  showScreen('screen-drink');
}

/* ============ ЭКРАН 2: НАПИТКИ ============ */
function renderDrinkScreen(){
  const t = T[order.lang];
  document.getElementById('drink-eyebrow').textContent = t.drinkEyebrow;
  document.getElementById('drink-title').textContent = t.drinkTitle;
  const grid = document.getElementById('drink-grid');
  grid.innerHTML = '';
  t.drinks.forEach(name => {
    const card = document.createElement('button');
    card.className = 'drink-card';
    card.textContent = name;
    card.onclick = () => {
      order.drink = name;
      showScreen('screen-form');
    };
    grid.appendChild(card);
  });
}

/* ============ ЭКРАН 3: ФОРМА ============ */
function renderFormScreen(){
  const t = T[order.lang];
  document.getElementById('form-title').textContent = t.formTitle;

  document.getElementById('label-email').textContent = t.labelEmail;
  document.getElementById('input-email').placeholder = t.placeholderEmail;
  document.getElementById('error-email').textContent = t.errorEmail;

  document.getElementById('label-name').textContent = t.labelName;
  document.getElementById('input-name').placeholder = t.placeholderName;
  document.getElementById('error-name').textContent = t.errorName;

  document.getElementById('label-sugar').textContent = t.labelSugar;
  document.getElementById('sugar-toggle-text').textContent = t.sugarPlaceholder;
  const sugarOpts = document.getElementById('sugar-options');
  sugarOpts.innerHTML = '';
  [1,2,3].forEach(n => {
    const opt = document.createElement('div');
    opt.className = 'sugar-opt';
    opt.textContent = `${n} ${t.sugarSpoon(n)}`;
    opt.onclick = () => {
      order.sugar = n;
      document.querySelectorAll('.sugar-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
      document.getElementById('sugar-toggle-text').textContent = `${n} ${t.sugarSpoon(n)}`;
      sugarOpts.classList.remove('open');
    };
    sugarOpts.appendChild(opt);
  });

  document.getElementById('label-flavor').textContent = t.labelFlavor;
  renderFlavorOptions();

  document.getElementById('submit-btn').textContent = t.submitBtn;
  document.getElementById('send-error').textContent = t.sendError;
}

function renderFlavorOptions(){
  const t = T[order.lang];
  const wrap = document.getElementById('flavor-options');
  wrap.innerHTML = '';
  const list = [...t.flavors];
  if (secretUnlocked) list.push(t.secretFlavor);

  list.forEach(name => {
    const opt = document.createElement('div');
    opt.className = 'flavor-opt' + (name === t.secretFlavor ? ' secret' : '');
    opt.textContent = name;
    opt.onclick = () => {
      order.flavor = name;
      document.querySelectorAll('.flavor-opt').forEach(o => o.classList.remove('selected'));
      opt.classList.add('selected');
    };
    wrap.appendChild(opt);
  });
}

document.getElementById('sugar-toggle').addEventListener('click', () => {
  document.getElementById('sugar-options').classList.toggle('open');
});

/* ============ ВАЛИДАЦИЯ + ОТПРАВКА ============ */
document.getElementById('submit-btn').addEventListener('click', () => {
  const t = T[order.lang];
  const emailInput = document.getElementById('input-email');
  const nameInput = document.getElementById('input-name');
  let valid = true;

  order.email = emailInput.value.trim();
  order.name = nameInput.value.trim();

  if (!order.email){
    emailInput.classList.add('error');
    document.getElementById('error-email').classList.add('show');
    valid = false;
  } else {
    emailInput.classList.remove('error');
    document.getElementById('error-email').classList.remove('show');
  }

  if (!order.name){
    nameInput.classList.add('error');
    document.getElementById('error-name').classList.add('show');
    valid = false;
  } else {
    nameInput.classList.remove('error');
    document.getElementById('error-name').classList.remove('show');
  }

  if (!valid) return;

  // сахар и вкус необязательны к проверке жёстко, но если не выбраны — подставим дефолт
  if (!order.sugar) order.sugar = 1;
  if (!order.flavor) order.flavor = t.flavors[1];

  openConfirmModal();
});

/* ============ МОДАЛКА ПОДТВЕРЖДЕНИЯ ============ */
function openConfirmModal(){
  const t = T[order.lang];
  document.getElementById('modal-title').textContent = t.modalTitle;
  document.getElementById('modal-text').textContent = t.modalText(order);
  document.getElementById('modal-yes').textContent = t.modalYes;
  document.getElementById('modal-no').textContent = t.modalNo;
  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-no').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('open');
});

document.getElementById('modal-yes').addEventListener('click', async () => {
  const t = T[order.lang];
  const btn = document.getElementById('modal-yes');
  btn.disabled = true;
  btn.textContent = t.sending;

  try{
    const res = await fetch(BACKEND_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(order)
    });
    if (!res.ok) throw new Error('bad response');

    document.getElementById('modal-overlay').classList.remove('open');
    document.getElementById('thanks-title').textContent = t.thanksTitle;
    document.getElementById('thanks-text').textContent = t.thanksText;
    showScreen('screen-thanks');
  } catch(err){
    document.getElementById('send-error').classList.add('show');
    document.getElementById('modal-overlay').classList.remove('open');
  } finally {
    btn.disabled = false;
    btn.textContent = t.modalYes;
  }
});

/* ============ ПАСХАЛКА: ДВОЙНОЙ КЛИК ПО ЛОГО ============ */
document.getElementById('brand-logo').addEventListener('dblclick', () => {
  secretUnlocked = true;
  const t = T[order.lang];
  const toast = document.getElementById('toast');
  toast.textContent = t.secretToast;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3200);
  // если пользователь уже на экране формы — сразу обновим список вкусов
  if (document.getElementById('screen-form').classList.contains('active')){
    renderFlavorOptions();
  }
});
</script>
</body>
</html>
